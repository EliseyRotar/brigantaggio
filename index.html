-4 flex-wrap",children:["Vendicatori dei torti subiti","Difensori della fese cattolica","Ribelli contro il 'Piemontese'"].map(D=>_.jsx("div",{className:"px-5 py-2.5 bg-stone-900 text-white rounded-full text-xs lg:text-sm font-medium shadow",children:D},D))}),_.jsxs("div",{className:"grid grid-cols-1 md:grid-cols-2 gap-4 lg:gap-6 text-sm lg:text-base pt-2",children:[_.jsxs("div",{className:"bg-green-50 border border-green-800/20 p-5 rounded-xl",children:[_.jsxs("strong",{className:"text-green-900 flex items-center gap-1.5",children:[_.jsx("span",{className:"text-lg",children:"🤝"})," Complicità e Protezione"]}),_.jsx("p",{className:"text-stone-700 mt-2 text-xs lg:text-sm leading-relaxed",children:"I contadini condividevano l'odio verso i proprietari terrieri e le autorità, offrendo rifugio spontaneo e depistando le colonne militari."})]}),_.jsxs("div",{className:"bg-red-50 border border-red-800/20 p-5 rounded-xl",children:[_.jsxs("strong",{className:"text-red-900 flex items-center gap-1.5",children:[_.jsx("span",{className:"text-lg",children:"⚠️"})," Paura e Ritorsioni"]}),_.jsx("p",{className:"text-stone-700 mt-2 text-xs lg:text-sm leading-relaxed",children:"Le bande esigevano il supporto con la forza: chi veniva sospettato di fare la spia per la Guardia Nazionale subiva vendette spietate."})]})]})]}),speaker:"Lapomarda Davide",color:"#2F4F4F",notes:"Additional historical context added.Davide: Inizia la tua parte. Spiega la doppia natura del rapporto: i briganti erano eroi popolari ma applicavano anche una ferrea legge del terrore verso i delatori."},{id:7,title:"7. LE PRIME GRANDI BANDE",subtitle:"L'esplosione della guerra nel Mezzogiorno",content:_.jsxs("div",{className:"max-w-5xl mx-auto flex flex-col lg:flex-row gap-6 lg:gap-8 items-center",children:[_.jsxs("div",{className:"flex-1 space-y-4 lg:space-y-5",children:[_.jsx("p",{className:"text-base lg:text-lg text-stone-800",children:"Tra il 1861 e il 1863, intere province sfuggirono al controllo del neonato Stato italiano. Le bande si unirono formando vere e proprie armate."}),_.jsxs("div",{className:"grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs lg:text-sm",children:[_.jsxs("div",{className:"p-4 border-l-4 border-amber-800 bg-white/60 rounded-r-lg",children:[_.jsx("strong",{children:"Occupazione di paesi:"})," I briganti entravano nei borghi, bruciavano gli archivi comunali (per distruggere i registri delle tasse e di leva) e ripristinavano i ritratti di Francesco II."]}),_.jsxs("div",{className:"p-4 border-l-4 border-amber-800 bg-white/60 rounded-r-lg",children:[_.jsx("strong",{children:"Scontri in campo aperto:"})," In alcune occasioni le bande lucane e campane riuscirono a sconfiggere distaccamenti regolari dell'esercito."]})]}),_.jsx("p",{className:"text-xs lg:text-sm text-stone-600",children:"La borghesia agraria si rifugiò nei capoluoghi protetti, lasciando le campagne in mano agli insorti."})]}),_.jsxs("div",{className:"w-full lg:w-72 shrink-0",children:[_.jsxs("div",{className:"relative group cursor-pointer",onClick:()=>G({kind:"image",src:"./images/briganti-banda.jpg",title:"Una banda brigantesca",caption:"Formazione armata nei boschi del Mezzogiorno",info:"Le bande brigantesche erano formazioni mobili di 20–200 uomini, composte da ex soldati borbonici, contadini senza terra, renitenti alla leva e fuorilegge. Operavano attraverso imboscate fulminee e ritirate nei boschi impenetrabili, sfruttando la conoscenza capillare del territorio. Il governo italiano usò fotografie come questa come prova della 'natura criminale' del fenomeno, oscurando deliberatamente le motivazioni politiche e sociali della rivolta."}),children:[_.jsx("img",{src:"./images/briganti-banda.jpg",alt:"Banda armata",className:"w-full h-48 lg:h-60 object-cover rounded-2xl shadow-md border border-amber-900/20 transition group-hover:brightness-90"}),_.jsx("div",{className:"absolute top-2 right-2 bg-white/90 p-1.5 rounded-lg shadow border border-stone-200 text-stone-600 opacity-0 group-hover:opacity-100 transition pointer-events-none",children:_.jsx(bo,{size:12})})]}),_.jsx("div",{className:"text-xs text-center mt-2 text-stone-500 italic",children:"Formazione brigantesca nei boschi"})]})]}),speaker:"Lapomarda Davide",color:"#2F4F4F",notes:"Additional historical context added.Davide: Sottolinea l'atto simbolico di bruciare gli archivi comunali: significava azzerare i debiti, le tasse e le liste di leva."},{id:8,title:"8. CARMINE CROCCO",subtitle:"Il 'Generale dei Briganti' (1830-1905)",content:_.jsxs("div",{className:"max-w-5xl mx-auto flex flex-col lg:flex-row gap-6 lg:gap-8 items-start",children:[_.jsxs("div",{className:"w-full lg:w-72 shrink-0",children:[_.jsxs("div",{className:"relative group cursor-pointer",onClick:()=>G({kind:"image",src:"./images/carmine-crocco.jpg",title:"Carmine Crocco",caption:"Rionero in Vulture, 1830 – Portoferraio, 1905",info:"Ex bracciante e soldato borbonico, Carmine Donatello Crocco fu il più potente e carismatico capobanda del brigantaggio: comandò fino a 2.000 uomini nella foresta di Monticchio, sull'Appennino lucano. Tradito nel 1864 dal suo luogotenente Caruso, scampò alla fucilazione grazie a un'amnistia. In carcere dettò le sue celebri Memorie — documento fondamentale per comprendere il brigantaggio dal punto di vista dei vinti."}),children:[_.jsx("img",{src:"./images/carmine-crocco.jpg",alt:"Carmine Crocco",className:"w-full h-56 lg:h-64 object-cover rounded-2xl shadow-md border border-amber-900/20 transition group-hover:brightness-90"}),_.jsx("div",{className:"absolute top-2 right-2 bg-white/90 p-1.5 rounded-lg shadow border border-stone-200 text-stone-600 opacity-0 group-hover:opacity-100 transition pointer-events-none",children:_.jsx(bo,{size:12})})]}),_.jsx("div",{className:"text-xs text-center mt-2 text-stone-500 italic",children:"Carmine Crocco, capobanda della Basilicata"})]}),_.jsxs("div",{className:"flex-1 space-y-4",children:[_.jsxs("div",{children:[_.jsx("div",{className:"text-xs font-semibold text-amber-800 uppercase tracking-widest",children:"Il Personaggio Chiave"}),_.jsx("h3",{className:"text-2xl lg:text-3xl font-bold text-stone-900",children:"Da bracciante a stratega militare"})]}),_.jsx("p",{className:"text-sm lg:text-base text-stone-700 leading-relaxed",children:"Nato a Rionero in Vulture, Carmine Crocco divenne il capo indiscusso del brigantaggio lucano. Dotato di un carisma straordinario, riuscì a federare decine di bande, arrivando a comandare oltre 2.000 uomini."}),_.jsxs("div",{className:"grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs lg:text-sm pt-1",children:[_.jsxs("div",{className:"bg-amber-900/5 p-3 rounded-lg border border-amber-900/10",children:[_.jsx("strong",{className:"text-amber-900",children:"Mente tattica:"})," Sfruttò la foresta di Monticchio come base inespugnabile."]}),_.jsxs("div",{className:"bg-amber-900/5 p-3 rounded-lg border border-amber-900/10",children:[_.jsx("strong",{className:"text-amber-900",children:"Fine politico:"})," Si alleò con i comitati borbonici per ottenere armi e legittimazione."]})]}),_.jsx("div",{className:"mt-2 bg-[#3F2A1D] text-amber-100 p-3 lg:p-4 rounded-xl text-xs lg:text-sm",children:"Arrestato nel 1864 dopo il tradimento del suo luogotenente Caruso, scampò alla pena di morte e dettò le sue celebri memorie in carcere."})]})]}),speaker:"Lapomarda Davide",color:"#2F4F4F",notes:"Additional historical context added.Davide: Crocco è il simbolo assoluto. Spiega che aveva un'intelligenza militare innata, pur essendo analfabeta. Riusciva a muovere 2.000 uomini senza radio o mappe."},{id:9,title:"9. NINCO NANCO",subtitle:"La ferocia al servizio della rivolta",content:_.jsxs("div",{className:"max-w-5xl mx-auto flex flex-col lg:flex-row gap-6 lg:gap-8 items-center",children:[_.jsxs("div",{className:"flex-1 space-y-4",children:[_.jsxs("div",{children:[_.jsx("div",{className:"text-xl lg:text-2xl font-serif text-stone-800",children:"Giuseppe Nicola Summa"}),_.jsx("div",{className:"text-2xl lg:text-3xl font-bold text-amber-900 tracking-[3px]",children:"NINCO NANCO"})]}),_.jsx("p",{className:"text-sm lg:text-base text-stone-700 leading-relaxed",children:"Il più fidato e temuto luogotenente di Crocco. Celebre per il suo coraggio spregiudicato ma anche per la sua estrema e teatrale efferatezza contro i soldati catturati."}),_.jsxs("div",{className:"bg-stone-900 text-amber-100 p-4 lg:p-6 rounded-2xl text-xs lg:text-sm space-y-3 shadow-md",children:[_.jsx("p",{className:"font-semibold text-amber-400",children:"Il ruolo della violenza simbolica:"}),_.jsxs("ul",{className:"list-disc pl-5 space-y-1.5 text-stone-300",children:[_.jsx("li",{children:"Serviva a incutere un terrore paralizzante nei reparti della Guardia Nazionale."}),_.jsx("li",{children:"Rafforzava l'autorità interna alla banda, dove ogni segno di debolezza era fatale."}),_.jsx("li",{children:"Rappresentava la vendetta brutale del sottoproletariato contro i 'signori'."})]}),_.jsx("p",{className:"text-amber-500 pt-2 border-t border-stone-800 font-medium",children:"Catturato e subito ucciso a Frusci nel 1864, per impedirgli di rivelare le complicità dei notabili locali."})]})]}),_.jsxs("div",{className:"w-full lg:w-72 shrink-0",children:[_.jsx(kr,{center:[40.85,15.65],zoom:10,markers:[{lat:40.85,lng:15.65,title:"Avigliano",desc:"Città natale di Ninco Nanco"},{lat:40.8,lng:15.7,title:"Frusci",desc:"Luogo della sua uccisione (1864)"}],onExpand:()=>G({kind:"map",title:"I luoghi di Ninco Nanco",caption:"Giuseppe Nicola Summa — Avigliano, 1833 – Frusci, 1864",info:"Luogotenente di Crocco, Ninco Nanco operò tra i boschi dell'alta Basilicata. La sua cattura nel luglio 1864 fu seguita dall'esecuzione immediata: le autorità militari temevano che potesse rivelare i nomi dei complici tra i notabili locali, cosa che avrebbe scatenato uno scandalo politico di proporzioni enormi. Il suo corpo fu esposto pubblicamente per scoraggiare altri dalla resistenza.",center:[40.85,15.65],zoom:10,markers:[{lat:40.85,lng:15.65,title:"Avigliano",desc:"Città natale di Ninco Nanco"},{lat:40.8,lng:15.7,title:"Frusci",desc:"Luogo della sua uccisione (1864)"}]})}),_.jsx("div",{className:"text-xs text-center mt-2 text-stone-500 italic",children:"I luoghi di Ninco Nanco"})]})]}),speaker:"Lapomarda Davide",color:"#2F4F4F",notes:"Additional historical context added.Davide: Ninco Nanco rappresenta la rabbia pura. Fu ucciso subito dopo la cattura perché conosceva i nomi dei ricchi che facevano il doppio gioco."},{id:10,title:"10. JOSÉ BORJES",subtitle:"Il tragico sogno di un esercito regolare",content:_.jsxs("div",{className:"max-w-5xl mx-auto flex flex-col lg:flex-row gap-6 lg:gap-8 items-start",children:[_.jsxs("div",{className:"flex-1 space-y-4",children:[_.jsx("p",{className:"text-sm lg:text-base text-stone-800 leading-relaxed",children:"Il generale catalano José Borjes fu inviato dal re in esilio Francesco II per trasformare le bande indisciplinate in un vero esercito di liberazione legittimista."}),_.jsxs("div",{className:"grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs lg:text-sm",children:[_.jsxs("div",{className:"border border-green-800/20 p-4 rounded-xl bg-green-50/50",children:[_.jsx("strong",{className:"text-green-900 block mb-1",children:"L'Obiettivo:"}),"Imporre la disciplina militare, vietare i saccheggi inutili e coordinare una marcia su Napoli."]}),_.jsxs("div",{className:"border border-red-800/20 p-4 rounded-xl bg-red-50/50",children:[_.jsx("strong",{className:"text-red-900 block mb-1",children:"Il Fallimento:"}),"Crocco, geloso della propria leadership, rifiutò di sottomettersi a un comandante straniero."]})]}),_.jsx("div",{className:"bg-white/60 p-3 lg:p-4 rounded-xl border border-amber-900/10 text-xs lg:text-sm text-stone-700",children:"Abbandonato dai briganti, Borjes tentò di fuggire verso lo Stato Pontificio ma fu catturato a Tagliacozzo e fucilato dal maggiore Franchini l'8 dicembre 1861."})]}),_.jsxs("div",{className:"w-full lg:w-72 shrink-0",children:[_.jsx(kr,{center:[40.5,14.5],zoom:6,markers:[{lat:38.05,lng:16.05,title:"Sbarco in Calabria",desc:"Brancaleone, sett. 1861"},{lat:42.08,lng:13.08,title:"Fucilazione",desc:"Tagliacozzo, dic. 1861"}],onExpand:()=>G({kind:"map",title:"La parabola di José Borjes",caption:"Tarragona 1813 – Tagliacozzo, 8 dicembre 1861",info:"Il generale catalano José Borjes sbarcò a Brancaleone (Calabria) nel settembre 1861 con l'incarico di trasformare le bande in un esercito regolare per Francesco II. Crocco rifiutò di subordinarsi a un comandante straniero e sabotò ogni tentativo di disciplina militare. Abbandonato, Borjes tentò la fuga verso lo Stato Pontificio ma fu catturato dai bersaglieri del maggiore Franchini a Tagliacozzo e fucilato l'8 dicembre 1861. Lasciò un diario di straordinaria lucidità.",center:[40.5,14.5],zoom:6,markers:[{lat:38.05,lng:16.05,title:"Sbarco in Calabria",desc:"Brancaleone, sett. 1861"},{lat:42.08,lng:13.08,title:"Fucilazione",desc:"Tagliacozzo, dic. 1861"}]})}),_.jsx("div",{className:"text-xs text-center mt-2 text-stone-500 italic",children:"La parabola del generale Borjes"})]})]}),speaker:"Lapomarda Davide",color:"#2F4F4F",notes:"Additional historical context added.Davide: Borjes tenne un diario famosissimo in cui scrisse: 'Crocco è un mostro, i suoi uomini non vogliono la causa del Re, vogliono solo saccheggiare'. Fine parte Davide."},{id:11,title:"11. LA REPRESSIONE DELLO STATO",subtitle:"La risposta militare italiana (Elisey)",content:_.jsxs("div",{className:"max-w-5xl mx-auto flex flex-col lg:flex-row gap-6 lg:gap-8 items-center",children:[_.jsxs("div",{className:"flex-1 space-y-4",children:[_.jsxs("div",{className:"text-center lg:text-left",children:[_.jsx("span",{className:"text-xs font-bold text-amber-800 uppercase tracking-widest block mb-1",children:"L'Intervento di Massa"}),_.jsxs("div",{className:"text-xl lg:text-2xl text-stone-900",children:["Lo Stato inviò circa ",_.jsx("strong",{className:"text-amber-900 text-3xl lg:text-4xl",children:"100.000 soldati"})," nel Sud"]})]}),_.jsx("p",{className:"text-sm lg:text-base text-stone-700 leading-relaxed",children:"Per non perdere il controllo del Mezzogiorno, il governo di Torino decise di rispondere con la forza massima. Quasi metà dell'intero esercito italiano fu schierato nelle province meridionali."}),_.jsx("div",{className:"grid grid-cols-2 sm:grid-cols-3 gap-2 lg:gap-3 text-xs lg:text-sm",children:["Rastrellamenti","Posti di blocco","Perquisizioni","Arresti di massa","Fucilazioni","Confische"].map((D,$)=>_.jsx("div",{className:"p-2.5 bg-white border border-stone-200 rounded-lg text-center font-semibold text-stone-800 shadow-2xs",children:D},$))}),_.jsxs("div",{className:"p-3 lg:p-4 bg-stone-900 text-amber-50 rounded-xl text-center text-xs lg:text-sm font-medium",children:["Comandanti supremi: ",_.jsx("span",{className:"text-amber-400",children:"Enrico Cialdini"})," e ",_.jsx("span",{className:"text-amber-400",children:"Emilio Pallavicini"})]})]}),_.jsxs("div",{className:"w-full lg:w-72 shrink-0",children:[_.jsxs("div",{className:"relative group cursor-pointer",onClick:()=>G({kind:"image",src:"./images/repressione.jpg",title:"La repressione militare",caption:"Truppe regolari in operazione nel Mezzogiorno (1861–1865)",info:"Tra il 1861 e il 1865, il governo italiano dislocò circa 100.000 soldati nel Mezzogiorno — quasi la metà dell'intero esercito nazionale. La campagna fu guidata dai generali Enrico Cialdini ed Emilio Pallavicini, che applicarono una strategia di terrore collettivo: rastrellamenti, esecuzioni sommarie, distruzione dei raccolti, deportazioni. La legge Pica del 1863 sospese i diritti civili nelle province 'infette', sottoponendo i civili ai tribunali militari."}),children:[_.jsx("img",{src:"./images/repressione.jpg",alt:"Esercito italiano",className:"w-full h-48 lg:h-60 object-cover rounded-2xl shadow-md border border-amber-900/20 transition group-hover:brightness-90"}),_.jsx("div",{className:"absolute top-2 right-2 bg-white/90 p-1.5 rounded-lg shadow border border-stone-200 text-stone-600 opacity-0 grou
